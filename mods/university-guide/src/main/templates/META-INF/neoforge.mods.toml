# Archivo neoforge.mods.toml con los datos necesarios para cargar el mod.
# Tiene varios campos obligatorios (#mandatory) y muchos opcionales (#optional).
# El formato general es TOML estándar, v0.5.0.
# Este archivo contiene un par de listas TOML.
# Más información sobre el formato TOML aquí: https://github.com/toml-lang/toml

# Tipo de cargador de mods; para mods FML @Mod normales debe ser javafml
modLoader="javafml" #mandatory

# Rango de versiones del cargador; para FML @Mod normales es la versión de FML, actualmente 2.
loaderVersion="${loader_version_range}" #mandatory

# Licencia del mod. Este dato es obligatorio y aclara las condiciones de redistribución.
# Opciones en https://choosealicense.com/. All rights reserved es la postura predeterminada de derechos de autor.
license="${mod_license}"

# URL para reportar problemas con este mod
#issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/" #optional

# Lista de mods; la cantidad permitida depende del cargador
[[mods]] #mandatory

# ID del mod
modId="${mod_id}" #mandatory

# Número de versión del mod
version="${mod_version}" #mandatory

# Nombre visible del mod
displayName="${mod_name}" #mandatory

# URL para buscar actualizaciones del mod. Especificación JSON en https://docs.neoforged.net/docs/misc/updatechecker/
#updateJSONURL="https://change.me.example.invalid/updates.json" #optional

# URL de la página principal del mod, visible en la interfaz de mods
#displayURL="https://change.me.to.your.mods.homepage.example.invalid/" #optional

# Archivo (en la raíz del JAR) con el logotipo que se muestra
#logoFile="universityguide.png" #optional

# Texto visible en la interfaz de mods
#credits="" #optional

# Autores del mod, visibles en la interfaz de mods (opcional)
#authors=""

# Descripción del mod, admite varias líneas (#mandatory)
authors="UVG"
description='''
Guía turístico con pathfinding y paradas configurables para recorridos universitarios.
'''

# El bloque [[mixins]] declara la configuración de mixins para que FML la cargue.
#[[mixins]]
#config="${mod_id}.mixins.json"

# El bloque [[accessTransformers]] indica dónde está el archivo AT.
# Si se omite, se intenta cargar un AT desde META-INF/accesstransformer.cfg
#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

# Dependencia; usa . para indicar la dependencia de un modid. Las dependencias son opcionales.
[[dependencies.${mod_id}]] #optional
    # ID del mod de la dependencia
    modId="neoforge" #mandatory
    # Tipo de dependencia: "required", "optional", "incompatible" o "discouraged" (sin distinguir mayúsculas).
    # 'required' exige que el mod exista; 'optional' no
    # 'incompatible' impide cargar el juego si el mod existe, y 'discouraged' muestra una advertencia
    type="required" #mandatory
    # Campo opcional que explica por qué la dependencia es necesaria o incompatible
    # reason="..."
    # Rango de versiones de la dependencia
    versionRange="[${neo_version},)" #mandatory
    # Relación de orden con la dependencia.
    # BEFORE: este mod se carga ANTES de la dependencia
    # AFTER: este mod se carga DESPUÉS de la dependencia
    ordering="NONE"
    # Lado en el que se aplica la dependencia: BOTH, CLIENT o SERVER
    side="BOTH"

# Otra dependencia
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    # Este rango exige como mínimo la versión actual de Minecraft y excluye la siguiente versión mayor
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Las características son propiedades del entorno de juego que el mod puede exigir. Este ejemplo declara
# que el mod requiere GL 3.2 o superior. Se agregarán otras características. Dependen del lado, así que declarar esto
# no impide, por ejemplo, cargar el mod en el servidor.
#[features.${mod_id}]
#openGLVersion="[3.2,)"
