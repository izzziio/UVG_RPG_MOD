plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.146'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define aquí los valores del wrapper para conservarlos al actualizar.
    // Wrapper.DistributionType.ALL descarga también las fuentes de Gradle y
    // documentación al pasar el cursor; esto aumenta el
    // tamaño de Gradle. Si eliges ALL, ejecuta dos veces la tarea wrapper.
    // Comprueba que distributionUrl termina en -all en las propiedades del wrapper.
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Incluye recursos de los generadores.
    srcDir('src/generated/resources')

    // Excluye recursos exclusivos del desarrollo.
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Añade repositorios adicionales si las dependencias los necesitan.
}

base {
    archivesName = mod_id
}

// Minecraft 1.21.1 usa Java 21; el mod utiliza esa versión.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Versión de NeoForge que se utiliza.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // Los transformadores de acceso se detectan automáticamente.
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Configuraciones de ejecución predeterminadas.
    // Se pueden modificar, eliminar o duplicar según sea necesario.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Inicia GameTestServer, ejecuta las pruebas registradas y termina.
        // El servidor termina con error si no hay pruebas registradas.
        // Las otras ejecuciones permiten pruebas mediante /test.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            // Ejemplo para cambiar workingDirectory; descomenta para activarlo.
            // gameDirectory = project.file('run-data')

            // Define ID del mod, destino de recursos generados y recursos existentes.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // Se aplica a las ejecuciones anteriores.
        configureEach {
            // Datos recomendados para los registros de desarrollo.
            // Añade o retira marcadores separados por comas.
            // "SCAN": exploración de mods.
            // "REGISTRIES": registra eventos de registro.
            // "REGISTRYDUMP": muestra contenido de registros.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Nivel recomendado para la consola.
            // Permite configurar distintos niveles.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // Asocia cada mod con sus fuentes.
        // Estas asociaciones indican qué fuentes pertenecen a cada mod.
        // Los proyectos con varios mods declaran una asociación por mod.
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Declara la configuración de dependencias localRuntime.
// Usa esta configuración en lugar de runtimeOnly para declarar
// una dependencia disponible durante las pruebas, pero
// opcional: no se incorpora a los proyectos que dependan de este mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Ejemplo de dependencia opcional de JEI.
    // La API de JEI se usa al compilar; el paquete completo, al ejecutar.
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // Usa localRuntime para no publicar JEI como dependencia obligatoria.
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Ejemplo de dependencia JAR desde el repositorio local ./libs.
    // Corresponde a ./libs/coolmod-${mc_version}-${coolmod_version}.jar.
    // La búsqueda ignora el grupo; aquí está vacío.
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Ejemplo de dependencia mediante archivo.
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Ejemplo de dependencia entre proyectos.
    // implementation project(":myproject")

    // Más información:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// Expande las propiedades dentro de las plantillas de recursos.
// Una propiedad ausente causa un error; usa la notación ${} de Groovy.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_min_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
// Incluye los metadatos generados como recursos de compilación.
// Funciona al compilar con Gradle o desde el entorno de desarrollo.
sourceSets.main.resources.srcDir generateModMetadata
// Genera metadatos al recargar el proyecto para evitar pasos manuales.
neoForge.ideSyncTask generateModMetadata

// Configuración de publicación mediante maven-publish.
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs.add('-Xlint:deprecation')
}

// Excluye clases y estructuras de prueba de la distribución.
tasks.named('jar') {
    exclude 'gt/edu/uvg/universityguide/*GameTests*.class'
    exclude 'gt/edu/uvg/universityguide/client/GuideClientChecks*.class'
    exclude 'data/universityguide/structure/empty.nbt'
}

// Activa explícitamente la descarga de fuentes y documentación en IDEA.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
