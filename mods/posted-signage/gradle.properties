# Memoria predeterminada para los comandos de Gradle. Se puede cambiar con propiedades del usuario o de la línea de comandos.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Más información en https://github.com/neoforged/ModDevGradle?tab=readme-ov-file#better-minecraft-parameter-names--javadoc-parchment
# Las versiones más recientes están en: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
# Propiedades del entorno
# Las versiones más recientes están aquí: https://projects.neoforged.net/neoforged/neoforge
# La versión de Minecraft debe coincidir con la de NeoForge para obtener un artefacto válido
minecraft_version=1.21.1
# El rango de versiones de Minecraft puede usar como límites cualquier versión publicada.
# No se garantiza que las snapshots, preversiones y candidatas se ordenen bien,
# porque no siguen las convenciones estándar de versiones.
minecraft_version_range=[1.21.1]
# La versión de NeoForge debe coincidir con la de Minecraft para obtener un artefacto válido
neo_version=21.1.248
# Mantiene la compatibilidad con .248 aunque una verificación use un cargador más reciente.
neo_min_version=21.1.248
# El rango de versiones del cargador solo puede usar como límites la versión mayor de FML
loader_version_range=[1,)

## Propiedades del mod

# Identificador único del mod. Debe estar en minúsculas y cumplir la expresión regular [a-z][a-z0-9_]{1,63}
# Debe coincidir con la constante String de la clase principal anotada con @Mod.
mod_id=posted_signage
# Nombre visible del mod.
mod_name=Posted Signage
# Licencia del mod. Opciones en https://choosealicense.com/. All Rights Reserved es la predeterminada.
mod_license=All Rights Reserved
# Versión del mod. Consulta https://semver.org/
mod_version=1.7.5
# ID de grupo del mod. Solo importa al publicar el artefacto en un repositorio Maven.
# Debe coincidir con el paquete base de las fuentes del mod.
# Consulta https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.postedsignage
