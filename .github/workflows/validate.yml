name: Validar mods

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar la caché de Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validar y compilar ambos mods
        shell: powershell
        run: ./herramientas/compilar.ps1

      - name: Subir los JAR distribuibles
        uses: actions/upload-artifact@v4
        with:
          name: uvg-minecraft-mods
          if-no-files-found: error
          path: |
            mods/posted-signage/build/libs/*.jar
            mods/university-guide/build/libs/*.jar
