
name: Build Mods

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Posted Signage
        working-directory: mods/posted-signage
        run: bash ./gradlew build

      - name: Build University Guide
        working-directory: mods/university-guide
        run: bash ./gradlew build
